[project]
name = "sparse-signal-loop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "httpx",
    "jinja2",
    "numpy",
    "prime-sandboxes>=0.2.13",
    "pytrec-eval-terrier",
    "requests",
    "swebench==4.1.0",
    "tenacity",
    "verifiers>=0.1.12.dev1",
]

[tool.uv]
prerelease = "allow"

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Focused set: correctness + import order + unused args (no broad B/SIM/UP churn on env code).
select = ["E4", "E7", "E9", "F", "I", "ARG"]
ignore = [
    "E501", # line length
]

[tool.ruff.format]
quote-style = "double"
