[build-system]
requires = ["hatchling>=1.23"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiments"]

[project]
name = "sparse-signal-loop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "httpx",
    "jinja2",
    "longbenchpro",
    "longbenchpro-rlm",
    "mini-swe-agent-plus",
    "mini-swe-agent-plus-rlm",
    "numpy",
    "prime-sandboxes>=0.2.13",
    "pytrec-eval-terrier",
    "requests",
    "swebench==4.1.0",
    "tenacity",
    "verifiers>=0.1.12.dev1",
]

[tool.uv.sources]
longbenchpro = { path = "src/envs/longbenchpro", editable = true }
longbenchpro-rlm = { path = "src/envs/longbenchpro_rlm", editable = true }
mini-swe-agent-plus = { path = "src/envs/mini_swe_agent_plus", editable = true }
mini-swe-agent-plus-rlm = { path = "src/envs/mini_swe_agent_plus_rlm", editable = true }

[project.scripts]
ssl-phase0-lbp = "experiments.phase0_lbp.cli:main"
ssl-phase0-msap = "experiments.phase0_mini_swe.cli:main"
ssl-phase1-lbp = "experiments.phase1_lbp.cli:main"
ssl-phase1-msap = "experiments.phase1_mini_swe.cli:main"
ssl-experiment-report = "experiments.report_cli:main"

[tool.uv]
prerelease = "allow"

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Focused set: correctness + import order + unused args (no broad B/SIM/UP churn on env code).
select = ["E4", "E7", "E9", "F", "I", "ARG"]
ignore = [
    "E501", # line length
]

[tool.ruff.format]
quote-style = "double"
